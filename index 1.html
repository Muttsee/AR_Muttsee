<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR Motorcycle</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script><style>body{margin:0}#ui{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:999}button{padding:12px;border:none;border-radius:8px;background:#1976d2;color:#fff}</style></head><body><div id="ui"><button onclick="startBike()">สตาร์ทรถ</button><button onclick="toggleBlinkers()">ไฟกระพริบ</button></div><a-scene embedded arjs="sourceType:webcam;"><a-marker preset="hiro"><a-entity id="bike"><a-box position="0 0.25 0" width="1.2" height="0.35" depth="0.45" color="#d32f2f"></a-box><a-cylinder position="-0.4 0 0.25" radius="0.18" height="0.08" rotation="90 0 0" color="#222"></a-cylinder><a-cylinder position="0.4 0 0.25" radius="0.18" height="0.08" rotation="90 0 0" color="#222"></a-cylinder><a-box id="leftBlink" position="-0.75 0.35 0" width="0.08" height="0.08" depth="0.08" color="orange"></a-box><a-box id="rightBlink" position="0.75 0.35 0" width="0.08" height="0.08" depth="0.08" color="orange"></a-box></a-entity></a-marker><a-entity camera></a-entity></a-scene><script>let started=false,blink=null,audioCtx,engineOsc;function initA(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function startSound(){initA();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(120,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+1);g.gain.setValueAtTime(.15,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+1);o.start();o.stop(audioCtx.currentTime+1);}function engineOn(){engineOsc=audioCtx.createOscillator();let g=audioCtx.createGain();engineOsc.type='sawtooth';engineOsc.frequency.value=85;engineOsc.connect(g);g.connect(audioCtx.destination);g.gain.value=.05;engineOsc.start();engineOsc.g=g;}function engineOff(){if(engineOsc){engineOsc.stop();engineOsc=null;}}function startBike(){initA();const bike=document.querySelector('#bike');started=!started;if(started){startSound();setTimeout(engineOn,1000);bike.setAttribute('animation','property:rotation;to:0 0 2;dir:alternate;loop:true;dur:100');}else{engineOff();bike.removeAttribute('animation');}}function toggleBlinkers(){const l=document.querySelector('#leftBlink'),r=document.querySelector('#rightBlink');if(blink){clearInterval(blink);blink=null;l.setAttribute('visible',true);r.setAttribute('visible',true);return;}let on=true;blink=setInterval(()=>{on=!on;l.setAttribute('visible',on);r.setAttribute('visible',on);},300);}</script></body></html>
